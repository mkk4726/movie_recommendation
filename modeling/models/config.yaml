# 영화 추천 시스템 설정
# 파이프라인 실행 시 이 파일의 설정을 읽어와서 사용합니다.

# ========================================
# SVD 모델 설정
# ========================================
svd:
  # SVD 알고리즘 하이퍼파라미터
  n_factors: 20         # 잠재 요인(latent factor)의 개수
  n_epochs: 8          # 학습 반복 횟수
  lr_all: 0.005         # 학습률 (learning rate)
  reg_all: 0.02         # 정규화 계수 (regularization)
  
  # 실행 설정
  random_state: 42      # 랜덤 시드 (재현성을 위해)
  verbose: true         # 학습 과정 출력 여부
  
  # 데이터 분할
  test_size: 0.2        # 테스트 데이터 비율
  
  # 평점 범위
  rating_scale:
    - 0.5
    - 5.0
  
  # 데이터 통합 설정
  use_integrated_data: True  # Firebase 통합 데이터 사용 여부

# ========================================
# Item-Based Collaborative Filtering 설정
# ========================================
item_based:
  # 유사도 행렬 설정
  top_k: 1000             # 각 영화당 유지할 상위 K개의 유사 영화
  
  # 실행 설정
  verbose: true         # 학습 과정 출력 여부
  
  # 데이터 통합 설정
  use_integrated_data: True  # Firebase 통합 데이터 사용 여부

# ========================================
# NER (Named Entity Recognition) 설정
# ========================================
ner:
  # 모델 설정
  # model_name: "Qwen/Qwen2.5-1.5B-Instruct"  # 사용할 Qwen 모델 (1.5B, 3B, 7B 중 선택)
  model_name: "Qwen/Qwen2.5-3B-Instruct"  # 1.5B은 성능 영 별로긴 하네. 3B은 써야 함.
  
  # 허용된 모델명 목록
  allowed_models:
    - "Qwen/Qwen2.5-1.5B-Instruct"
    - "Qwen/Qwen2.5-3B-Instruct"
    - "Qwen/Qwen2.5-7B-Instruct"
  
  # 생성 파라미터
  max_new_tokens: 128         # 최대 생성 토큰 수 (JSON만 생성하므로 축소해 지연 단축)
  temperature: 0.0          # 생성 온도 (0.0 = 결정적, 높을수록 다양)
  top_p: 0.9                # Nucleus sampling 파라미터
  do_sample: false          # 샘플링 여부 -> false면 top_p 무시
  mps_single_device: true  # 메모리 여유 시 전체 모델을 MPS로 강제 배치(속도↑ 가능, OOM 위험)
  
  # System Prompt
  system_prompt: |
    You are a specialized information extraction system for movie queries. 
    Your ONLY task is to extract structured information from the user's query and return it as JSON.

    Extract the following information from the user query:
    - actors: Array of actor names mentioned (배우 이름)
    - genres: Array of genres mentioned
      
      CRITICAL for genres: Extract genres ONLY from the predefined list below. 
      If the user mentions genre-related content, map it to the matching genre from this list.
      For example: "로맨틱한 영화" → "로맨스", "재미있는 코메디" → "코미디", "액션 영화" → "액션"
      
      Allowed genres (ONLY use these exact strings):
      - 드라마
      - 로맨스 (covers: "로맨틱", "로맨틱한", "로맨틱한 영화" 등)
      - 코미디
      - 액션
      - 스릴러
      - 범죄
      - 공포
      - SF
      - 모험
      - 애니메이션
      - 판타지
      - 다큐멘터리
      - 역사
      - 음악
      - 전쟁
      
      If no genre is mentioned or cannot be mapped to these genres, return empty array []
    - years: Array of years mentioned (연도, 예: 2020)
    - directors: Array of director names mentioned (감독 이름)
    - movie_titles: Array of movie titles mentioned (영화 제목)
    - regions: Array of content regions mentioned (예: "미드", "영드", "일드", "한드" 등 지역/국가 구분)
    - story_keywords: Array of story or mood descriptors mentioned (예: "긴장감 넘치는", "감동적인", "재미있는" 등 스토리 관련 키워드)
    - other_keywords: Array of other relevant keywords (기타 키워드: "추천", "인기", "최신" 등)

    CRITICAL: Return ONLY a valid JSON object. Do not include any explanation, text, or markdown formatting. 
    If a field has no matches, use an empty array [].

    Example for query "이병헌이 출연한 액션 영화 추천해줘":
    {
      "actors": ["이병헌"],
      "genres": ["액션"],
      "years": [],
      "directors": [],
      "movie_titles": [],
      "regions": [],
      "story_keywords": [],
      "other_keywords": ["추천"]
    }

    Example for query "박정민이 나오는 로맨스 영화 중에 조금 긴장감 넘치는 영화 추천해줘":
    {
      "actors": ["박정민"],
      "genres": ["로맨스"],
      "years": [],
      "directors": [],
      "movie_titles": [],
      "regions": [],
      "story_keywords": ["긴장감 넘치는"],
      "other_keywords": ["추천"]
    }
