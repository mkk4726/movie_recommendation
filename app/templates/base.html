<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <meta name="format-detection" content="telephone=no" />
    <title>{{ title or "볼거 없나?" }}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='styles.css') }}" />
  </head>
  <body>
    <header class="app-header">
      <div class="container">
        <div class="header-title-row">
          <h1>🎬 볼거 없나?</h1>
          <button id="sidebar-toggle" class="sidebar-toggle-btn" aria-label="사이드바 토글">
            <span class="sidebar-toggle-icon">☰</span>
          </button>
        </div>
        <p class="subtitle">
          MovieLens + 하이브리드 추천 모델을 API와 간단한 웹 UI로 확인해보세요.
        </p>
      </div>
    </header>
    <div class="sidebar-overlay" id="sidebar-overlay"></div>
    <main class="container sidebar-container">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <h3 style="margin: 0;">메뉴</h3>
          <button id="sidebar-close" class="sidebar-close-btn" aria-label="사이드바 닫기">
            ✕
          </button>
        </div>
        {% block sidebar %}{% endblock %}
      </aside>
      <div class="main-content">
        {% block content %}{% endblock %}
      </div>
    </main>
    <footer class="app-footer">
      <div class="container">
        <p>데이터: MovieLens ML-32M · 메타데이터 확장 준비 중</p>
        <p>FastAPI + Jinja2 템플릿 예제</p>
      </div>
    </footer>
  </body>
</html>
