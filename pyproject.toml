[project]
name = "movie-recommendation"
version = "0.1.0"
description = "Movie recommendation system with AI-powered search"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "streamlit>=1.29.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0,<2.0.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "scikit-surprise>=1.1.3",
    "joblib>=1.3.0",
    "pyyaml>=6.0.1",
    "psutil>=5.9.0",
    "urllib3<2.4.0,>=1.24.2",
    "playwright>=1.40.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "firebase-admin>=6.0.0",
    "google-cloud-firestore>=2.11.0",
    "streamlit-cookies-manager>=0.2.0",
    "python-dotenv>=1.0.1",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "python-multipart>=0.0.6",
    "httpx>=0.27.0",
    "torch>=2.2",
    "transformers>=4.51.0",
    "accelerate>=0.33.0",
    "sentencepiece",
    "protobuf",
    "gliner2",
    "python-mecab-ko",
    "gliner",
    "faiss-cpu>=1.7.4",
    "langdetect",
    "einops",
    "timm",
    "torchvision",
    "matplotlib",
    "seaborn",
    "langgraph>=0.2.60",
    "langchain-openai>=0.2.14",
    "langchain-chroma>=0.1.4",
    "langchain>=0.3.13",
    "langchain-community>=0.3.13",
    "lark>=1.2.2",
    "jupyter>=1.1.1",
]

[project.optional-dependencies]
dev = [
    "ipykernel>=6.29.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/app",
    "src/cold_start",
    "src/dataset_generation",
    "src/modeling",
    "src/user_system",
    "src/vector_store",
    "src/data_scraping"
]

[tool.ruff]
# 줄 길이 제한
line-length = 120
# 타겟 Python 버전
target-version = "py310"
# 노트북 파일 제외
exclude = ["*.ipynb"]

[tool.ruff.lint]
# 활성화할 규칙 코드
# E: pycodestyle errors
# W: pycodestyle warnings
# F: pyflakes
# I: isort (import 정렬)
# B: flake8-bugbear
select = ["E", "W", "F", "I", "B"]
# 무시할 규칙
# E501: 줄 길이 제한 (URL 등 긴 라인 허용)
# E402: 모듈 레벨 import가 파일 최상단에 없음 (sys.path 조작 허용)
# B905: zip() 사용 시 strict 파라미터 강제 (기존 코드 호환성)
# B904: raise ... from err 강제 (예외 체이닝)
# W293: 빈 줄에 공백 포함 (멀티라인 문자열 내 공백 허용)
# B008: 함수 인자 기본값으로 함수 호출 (FastAPI Query, Depends 등에서 필수)
ignore = ["E501", "E402", "B905", "B904", "W293", "B008"]

[tool.ruff.format]
# 따옴표 스타일 (더블 쿼트 권장)
quote-style = "double"
# 들여쓰기 스타일
indent-style = "space"
# 매직 콤마 사용 (리스트 등이 길어지면 자동으로 여러 줄로 나눔)
skip-magic-trailing-comma = false
# 줄바꿈 문자
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[dependency-groups]
dev = [
    "pytest>=9.0.1",
    "ruff>=0.14.6",
]

